<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>รักต้า - Heart Text Animation</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600;700&family=Mitr:wght@500;700&family=Prompt:wght@500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050508;
            font-family: 'Kanit', sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        .glass-panel {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(244, 114, 182, 0.25);
        }
        .glow-btn {
            box-shadow: 0 0 15px rgba(244, 114, 182, 0.4);
        }
        .glow-btn:hover {
            box-shadow: 0 0 25px rgba(244, 114, 182, 0.7);
        }
    </style>
</head>
<body class="relative bg-[#050508] text-white">

    <!-- Canvas Animation -->
    <canvas id="heartCanvas"></canvas>

    <!-- Top Left Sound Toggle Button -->
    <button id="audioBtn" class="fixed top-4 left-4 z-20 p-3 rounded-full glass-panel glow-btn text-pink-400 hover:text-white transition-all duration-300 focus:outline-none flex items-center justify-center" title="เปิด/ปิด เสียงเพลงบรรยากาศ">
        <svg id="soundOffIcon" xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" />
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2" />
        </svg>
        <svg id="soundOnIcon" xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" />
        </svg>
    </button>

    <!-- Top Right Settings Menu Toggle Button -->
    <button id="menuBtn" class="fixed top-4 right-4 z-20 p-3 rounded-full glass-panel glow-btn text-pink-400 hover:text-white transition-all duration-300 focus:outline-none flex items-center justify-center" title="เมนูปรับแต่ง">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
        </svg>
    </button>

    <!-- Side Control Panel -->
    <div id="controlPanel" class="fixed top-0 right-0 w-80 max-w-[85vw] h-full glass-panel z-30 transform translate-x-full transition-transform duration-300 ease-in-out p-6 flex flex-col justify-between overflow-y-auto">
        <div>
            <div class="flex items-center justify-between pb-4 mb-6 border-b border-pink-500/30">
                <h2 class="text-xl font-bold text-pink-400 flex items-center gap-2">
                    <span>💖</span> ปรับแต่งหัวใจรักต้า
                </h2>
                <button id="closeMenuBtn" class="text-gray-400 hover:text-white p-1">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>

            <div class="space-y-4 text-sm">
                <!-- Main Name Input -->
                <div>
                    <label class="block text-pink-200 font-medium mb-1">ข้อความหลัก</label>
                    <input type="text" id="mainTextInput" value="รักต้า" class="w-full bg-slate-900 border border-pink-500/40 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-pink-400">
                </div>

                <!-- Color Presets -->
                <div>
                    <label class="block text-pink-200 font-medium mb-2">เลือกโทนสีเรืองแสง</label>
                    <div class="grid grid-cols-2 gap-2">
                        <button class="palette-btn bg-gradient-to-r from-pink-500 via-rose-400 to-cyan-400 p-2 rounded-lg text-xs font-semibold text-white border border-white/30" data-scheme="neon">
                            นีออน (ชมพู-ฟ้า)
                        </button>
                        <button class="palette-btn bg-gradient-to-r from-red-500 via-rose-500 to-amber-300 p-2 rounded-lg text-xs font-semibold text-white border border-white/30" data-scheme="romantic">
                            แดงกุหลาบ
                        </button>
                        <button class="palette-btn bg-gradient-to-r from-purple-500 via-pink-400 to-sky-300 p-2 rounded-lg text-xs font-semibold text-white border border-white/30" data-scheme="dreamy">
                            ม่วงฝันหวาน
                        </button>
                        <button class="palette-btn bg-gradient-to-r from-emerald-400 via-teal-300 to-cyan-400 p-2 rounded-lg text-xs font-semibold text-white border border-white/30" data-scheme="aurora">
                            ออโรรา
                        </button>
                    </div>
                </div>

                <!-- Font Select -->
                <div>
                    <label class="block text-pink-200 font-medium mb-1">ฟอนต์ตัวอักษร</label>
                    <select id="fontSelect" class="w-full bg-slate-900 border border-pink-500/40 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-pink-400">
                        <option value="Kanit">Kanit (มาตรฐานคมชัด)</option>
                        <option value="Mitr">Mitr (หัวกลมน่ารัก)</option>
                        <option value="Prompt">Prompt (โมเดิร์นเรียบหรู)</option>
                    </select>
                </div>

                <!-- Heartbeat Speed -->
                <div>
                    <label class="block text-pink-200 font-medium mb-1 flex justify-between">
                        <span>จังหวะการเต้นหัวใจ</span>
                        <span id="speedVal" class="text-pink-400">1.0x</span>
                    </label>
                    <input type="range" id="speedSlider" min="0.3" max="2.5" step="0.1" value="1.0" class="w-full accent-pink-500">
                </div>
            </div>
        </div>

        <div class="pt-6 border-t border-pink-500/30 space-y-3">
            <button id="saveBtn" class="w-full bg-gradient-to-r from-cyan-500 to-blue-500 text-white font-bold py-2.5 rounded-lg shadow-lg hover:brightness-110 active:scale-95 transition-all flex items-center justify-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                </svg>
                บันทึกรูปภาพส่งให้ต้า 📸
            </button>
            <button id="applyBtn" class="w-full bg-gradient-to-r from-pink-500 to-rose-500 text-white font-bold py-2.5 rounded-lg shadow-lg hover:brightness-110 active:scale-95 transition-all">
                อัปเดตเอฟเฟกต์ ✨
            </button>
        </div>
    </div>

    <!-- Center Hint -->
    <div id="hintText" class="fixed bottom-6 left-1/2 transform -translate-x-1/2 z-10 pointer-events-none text-center transition-opacity duration-1000">
        <p class="text-xs sm:text-sm text-pink-300 bg-slate-900/80 backdrop-blur-md px-4 py-2 rounded-full border border-pink-500/30 shadow-lg">
            ✨ แตะหรือลากนิ้วบนหน้าจอเพื่อกระจายความรัก ✨
        </p>
    </div>

    <!-- Web Audio Synthesizer (Romantic Music) -->
    <script>
        class SimpleAudioSynthesizer {
            constructor() {
                this.ctx = null;
                this.isPlaying = false;
                this.interval = null;
                this.notes = [261.63, 329.63, 392.00, 523.25, 587.33, 659.25]; // C, E, G, C5, D5, E5
            }

            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioContext();
                }
            }

            playTone(freq, duration = 2) {
                if (!this.ctx || !this.isPlaying) return;
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                    gain.gain.setValueAtTime(0, this.ctx.currentTime);
                    gain.gain.linearRampToValueAtTime(0.08, this.ctx.currentTime + 0.2);
                    gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + duration);
                } catch(e) {}
            }

            toggle() {
                this.init();
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
                this.isPlaying = !this.isPlaying;
                if (this.isPlaying) {
                    this.playSequence();
                    this.interval = setInterval(() => this.playSequence(), 2000);
                } else {
                    if (this.interval) clearInterval(this.interval);
                }
                return this.isPlaying;
            }

            playSequence() {
                const note1 = this.notes[Math.floor(Math.random() * this.notes.length)];
                const note2 = this.notes[Math.floor(Math.random() * this.notes.length)];
                this.playTone(note1, 2.5);
                setTimeout(() => this.playTone(note2, 2.0), 500);
            }
        }

        const synth = new SimpleAudioSynthesizer();
        const audioBtn = document.getElementById('audioBtn');
        const soundOnIcon = document.getElementById('soundOnIcon');
        const soundOffIcon = document.getElementById('soundOffIcon');

        audioBtn.addEventListener('click', () => {
            const active = synth.toggle();
            if (active) {
                soundOnIcon.classList.remove('hidden');
                soundOffIcon.classList.add('hidden');
            } else {
                soundOnIcon.classList.add('hidden');
                soundOffIcon.classList.remove('hidden');
            }
        });
    </script>

    <!-- Canvas Engine Script -->
    <script>
        const canvas = document.getElementById('heartCanvas');
        const ctx = canvas.getContext('2d');

        // UI Handles
        const controlPanel = document.getElementById('controlPanel');
        const menuBtn = document.getElementById('menuBtn');
        const closeMenuBtn = document.getElementById('closeMenuBtn');
        const applyBtn = document.getElementById('applyBtn');
        const saveBtn = document.getElementById('saveBtn');
        const mainTextInput = document.getElementById('mainTextInput');
        const fontSelect = document.getElementById('fontSelect');
        const speedSlider = document.getElementById('speedSlider');
        const speedVal = document.getElementById('speedVal');
        const hintText = document.getElementById('hintText');

        // Toggle Sidebar
        menuBtn.addEventListener('click', () => controlPanel.classList.remove('translate-x-full'));
        closeMenuBtn.addEventListener('click', () => controlPanel.classList.add('translate-x-full'));

        speedSlider.addEventListener('input', (e) => speedVal.textContent = `${e.target.value}x`);

        // Color Palettes
        const COLOR_PALETTES = {
            neon: ['#ff4d8d', '#ff1a75', '#00f0ff', '#80f6ff', '#ffffff', '#ff99c8'],
            romantic: ['#ff2a5f', '#ff4d79', '#ff809f', '#ff003c', '#ffffff', '#ffb3c6'],
            dreamy: ['#c084fc', '#d8b4fe', '#f472b6', '#38bdf8', '#ffffff', '#a855f7'],
            aurora: ['#34d399', '#22d3ee', '#38bdf8', '#f472b6', '#ffffff', '#10b981']
        };

        let currentPalette = COLOR_PALETTES.neon;

        document.querySelectorAll('.palette-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const scheme = btn.getAttribute('data-scheme');
                currentPalette = COLOR_PALETTES[scheme];
                createHeartParticles();
            });
        });

        let width, height;
        let particles = [];
        let mouse = { x: null, y: null, active: false };
        let beatTime = 0;

        // Resize Canvas
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            createHeartParticles();
        }

        window.addEventListener('resize', resize);

        // Mathematical Heart Curve Parametric Equation
        function getHeartPoint(t, scale) {
            const x = scale * 16 * Math.pow(Math.sin(t), 3);
            const y = -scale * (13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
            return { x, y };
        }

        // Particle Class
        class TextParticle {
            constructor(targetX, targetY, text, font, color, isOutline) {
                this.baseX = targetX;
                this.baseY = targetY;
                this.x = targetX + (Math.random() - 0.5) * (width * 0.8);
                this.y = targetY + (Math.random() - 0.5) * (height * 0.8);
                this.text = text;
                this.font = font;
                this.color = color;
                this.isOutline = isOutline;

                // Bright visible size
                this.fontSize = isOutline ? Math.random() * 5 + 16 : Math.random() * 6 + 12;
                this.vx = 0;
                this.vy = 0;
                this.friction = 0.88;
                this.ease = 0.05 + Math.random() * 0.04;

                this.angle = Math.random() * Math.PI * 2;
                this.floatSpeed = 0.02 + Math.random() * 0.02;
                this.floatRadius = isOutline ? 2 : 4;
            }

            update(beatScale) {
                const centerX = width / 2;
                const centerY = height / 2 - 15;

                const dx = this.baseX - centerX;
                const dy = this.baseY - centerY;

                // Pulsating Position
                const targetX = centerX + dx * beatScale;
                const targetY = centerY + dy * beatScale;

                // Float Motion
                this.angle += this.floatSpeed;
                let destX = targetX + Math.cos(this.angle) * this.floatRadius;
                let destY = targetY + Math.sin(this.angle) * this.floatRadius;

                // Mouse interaction
                if (mouse.active && mouse.x !== null) {
                    const mdx = mouse.x - this.x;
                    const mdy = mouse.y - this.y;
                    const dist = Math.sqrt(mdx * mdx + mdy * mdy);
                    if (dist < 150) {
                        const force = (150 - dist) / 150;
                        destX += Math.cos(Math.atan2(mdy, mdx)) * force * 60;
                        destY += Math.sin(Math.atan2(mdy, mdx)) * force * 60;
                    }
                }

                // Physics spring
                this.vx += (destX - this.x) * this.ease;
                this.vy += (destY - this.y) * this.ease;
                this.vx *= this.friction;
                this.vy *= this.friction;

                this.x += this.vx;
                this.y += this.vy;
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.font = `700 ${this.fontSize}px '${this.font}', 'Kanit', sans-serif`;
                
                // Bright high-contrast glow
                ctx.shadowColor = this.color;
                ctx.shadowBlur = this.isOutline ? 12 : 6;
                ctx.fillStyle = this.color;

                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(this.text, 0, 0);
                ctx.restore();
            }
        }

        // Create Particles forming Heart
        function createHeartParticles() {
            particles = [];
            const mainText = mainTextInput.value.trim() || "รักต้า";
            const font = fontSelect.value;
            const wordVariants = [mainText, "รักต้า", "รักต้านะ", "ต้า", "รักต้าที่สุด"];

            const centerX = width / 2;
            const centerY = height / 2 - 15;

            // Compute Scale for canvas
            const minDim = Math.min(width, height);
            const scale = minDim > 600 ? minDim / 38 : minDim / 30;

            // 1. Outline (High Density)
            const outlineCount = 320;
            for (let i = 0; i < outlineCount; i++) {
                const t = (i / outlineCount) * Math.PI * 2;
                const pt = getHeartPoint(t, scale);
                const color = currentPalette[i % currentPalette.length];
                const text = wordVariants[i % wordVariants.length];
                particles.push(new TextParticle(centerX + pt.x, centerY + pt.y, text, font, color, true));
            }

            // 2. Inner Fill
            const fillCount = 280;
            for (let i = 0; i < fillCount; i++) {
                const r = Math.sqrt(Math.random()) * 0.92;
                const t = Math.random() * Math.PI * 2;
                const pt = getHeartPoint(t, scale);
                const color = currentPalette[Math.floor(Math.random() * currentPalette.length)];
                const text = wordVariants[Math.floor(Math.random() * wordVariants.length)];
                particles.push(new TextParticle(centerX + pt.x * r, centerY + pt.y * r, text, font, color, false));
            }
        }

        // Save Image
        saveBtn.addEventListener('click', () => {
            const link = document.createElement('a');
            link.download = 'รักต้า-heart.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        });

        // Apply settings
        applyBtn.addEventListener('click', () => {
            createHeartParticles();
            controlPanel.classList.add('translate-x-full');
        });

        // Pointer Events
        function handlePointer(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            mouse.x = clientX - rect.left;
            mouse.y = clientY - rect.top;
            mouse.active = true;
            hintText.style.opacity = '0';
        }

        function handlePointerLeave() {
            mouse.active = false;
            mouse.x = null;
            mouse.y = null;
        }

        window.addEventListener('mousemove', handlePointer);
        window.addEventListener('touchstart', handlePointer, { passive: true });
        window.addEventListener('touchmove', handlePointer, { passive: true });
        window.addEventListener('mouseup', handlePointerLeave);
        window.addEventListener('touchend', handlePointerLeave);

        // Main Animation Loop
        function animate() {
            // Dark solid background reset
            ctx.fillStyle = '#050508';
            ctx.fillRect(0, 0, width, height);

            // Heartbeat scale
            const speed = parseFloat(speedSlider.value);
            beatTime += 0.035 * speed;
            const pulse = Math.sin(beatTime);
            const beatScale = 1 + (Math.pow(Math.max(0, pulse), 3) * 0.08) + (Math.sin(beatTime * 2) * 0.02);

            // Update & Render Particles
            particles.forEach(p => {
                p.update(beatScale);
                p.draw();
            });

            requestAnimationFrame(animate);
        }

        // Run On Load
        window.onload = function() {
            resize();
            animate();
        };
    </script>
</body>
</html>
